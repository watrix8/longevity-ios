name: Longevity
options:
  bundleIdPrefix: pl.tippin
  # Polski jest językiem źródłowym: teksty w kodzie są po polsku i to one są
  # kluczami w String Catalogu. Angielski dochodzi jako tłumaczenie.
  developmentLanguage: pl
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Longevity:
    type: application
    platform: iOS
    sources:
      - Longevity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.tippin.longevity
        GENERATE_INFOPLIST_FILE: YES
        # Wersje muszą tu być jawnie: przy GENERATE_INFOPLIST_FILE Xcode bierze
        # CFBundleShortVersionString i CFBundleVersion właśnie z tych dwóch pól,
        # a puste wartości App Store Connect odrzuca przy wgrywaniu paczki.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Bez tego iOS uruchamia app w trybie zgodności i letterboxuje ją (czarne pasy).
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Longevity uses your health data to calculate your personalized longevity score and track wellness metrics over time."
        INFOPLIST_KEY_NSCameraUsageDescription: "Longevity uses the camera so you can photograph a meal and get its calories and macros estimated."
        # Apka gada z serwerem wyłącznie po HTTPS, więc podlega zwolnieniu z
        # deklaracji eksportowej. Bez tego klucza App Store Connect pyta o to
        # przy każdym buildzie z osobna.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Tylko iPhone — układ ekranów jest zbudowany na stałych odstępach i
        # jednej kolumnie, więc na iPadzie wyglądałby jak rozciągnięta apka.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ekstrakcja tekstów z kodu do Localizable.xcstrings przy buildzie w Xcode.
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TBWVLKBMF4
    dependencies:
      - package: Supabase
    entitlements:
      path: Longevity/Longevity.entitlements
      properties:
        com.apple.developer.healthkit: true

  LongevityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LongevityTests
    dependencies:
      - target: Longevity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.tippin.longevity.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Longevity.app/Longevity"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LongevityWatch:
    type: application
    platform: watchOS
    sources:
      - LongevityWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.tippin.longevity.watch
        SWIFT_VERSION: "6.0"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
    dependencies:
      - target: LongevityWatchExtension

  LongevityWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - LongevityWatchExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.tippin.longevity.watch.extension
        SWIFT_VERSION: "6.0"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"

schemes:
  Longevity:
    build:
      targets:
        Longevity: all
        LongevityTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LongevityTests
    archive:
      config: Release
  LongevityWatch:
    build:
      targets:
        LongevityWatch: all
        LongevityWatchExtension: all
    run:
      config: Debug
    archive:
      config: Release
